<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AquaMonitor | Monitoreo del agua</title>
  <link rel="stylesheet" href="/monitor.css">
  <script src="/monitor.js" defer></script>
</head>
<body>
  <header><div class="shell bar"><strong>AquaMonitor</strong><a href="/admin.html">Administraci?n</a></div></header>
  <main class="shell">
    <div class="intro">
      <h1>Monitoreo del agua</h1>
      <p id="status" role="status">Cargando mediciones?</p>
      <p>?ltima medici?n <time id="latest">?</time></p>
    </div>
    <section class="grid" aria-label="Lecturas y gr?ficas">
      <article data-sensor="temperatura"><h2>Temperatura</h2><p class="reading">?</p><canvas role="img" aria-label="Historial de temperatura"></canvas><p class="range"></p></article>
      <article data-sensor="turbidez"><h2>Turbidez</h2><p class="reading">?</p><canvas role="img" aria-label="Historial de turbidez"></canvas><p class="range"></p></article>
      <article data-sensor="nivel_agua"><h2>Nivel del agua</h2><p class="reading">?</p><canvas role="img" aria-label="Historial de nivel del agua"></canvas><p class="range"></p></article>
      <article data-sensor="distancia_cm"><h2>Distancia al agua</h2><p class="reading">?</p><canvas role="img" aria-label="Historial de distancia al agua"></canvas><p class="range"></p></article>
    </section>
  </main>
</body>
</html>
